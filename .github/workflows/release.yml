name: Release
# Push a tag such as v0.3.0. It must match packages/dsh-plugin/package.json and the version
# name in apps/mobile/pubspec.yaml. One GitHub release carries the DSH plugin tarball and the
# signed Android APK (key: apps/mobile/tool/create-release-key.ps1). A tag on a commit that
# main does not contain yet is published as a pre-release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Check the tag matches the plugin and app versions
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./packages/dsh-plugin/package.json').version")" = "$version"
          test "$(sed -n 's/^version: *\([^+]*\).*/\1/p' apps/mobile/pubspec.yaml)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run test:plugin
      - run: bun run build:plugin
      - name: Pack
        working-directory: packages/dsh-plugin
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --pack-destination "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: ${{ runner.temp }}/release/dsh-remote-plugin-*.tgz
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Flutter SDK
        run: |
          git clone --branch 3.47.6 --depth 1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - name: Build the signed APK
        working-directory: apps/mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Never publish an unsigned or debug-signed APK.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release key missing; run apps/mobile/tool/create-release-key.ps1 once"
            exit 1
          fi
          # Windows PowerShell 5.1 ends piped secrets with CRLF; all three values are
          # whitespace-free (base64 / URL-safe), so line endings and spaces are stripped.
          clean() { printf '%s' "$1" | tr -d '
 '; }
          export DSH_ANDROID_KEYSTORE="$RUNNER_TEMP/release.p12"
          export DSH_ANDROID_KEYSTORE_PASSWORD="$(clean "$KEYSTORE_PASSWORD")"
          export DSH_ANDROID_KEY_ALIAS="$(clean "$KEY_ALIAS")"
          clean "$KEYSTORE_BASE64" | base64 -d > "$DSH_ANDROID_KEYSTORE"
          flutter build apk --release
          rm -f "$DSH_ANDROID_KEYSTORE"
          mkdir -p "$RUNNER_TEMP/release"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/release/dsh-remote-${GITHUB_REF_NAME#v}.apk"
      - name: Verify the APK signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$RUNNER_TEMP"/release/dsh-remote-*.apk | grep -i 'SHA-256'
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/release/dsh-remote-*.apk
          if-no-files-found: error
  release:
    needs: [plugin, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plugin.outputs.version }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          prerelease=--prerelease
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then prerelease=; fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > notes.md <<EOF
          **DSH 插件**：在 DSH 中打开「插件 → 添加插件」，粘贴
          \`${base}/dsh-remote-plugin-${VERSION}.tgz\`
          启用后在插件页粘贴控制台给出的配对链接即可连接。自托管的中继在 \`/plugin/manifest.json\` 也提供与其配套的插件包。

          **Android**：下载 \`dsh-remote-${VERSION}.apk\` 安装（需允许安装未知来源的应用）。后续版本使用同一签名，可直接覆盖升级。

          **Plugin**: in DSH, Plugins → Add plugin, paste the plugin URL above, then paste a pairing link from the console. **Android**: install \`dsh-remote-${VERSION}.apk\`; later versions upgrade in place.

          Checksums: \`SHA256SUMS.txt\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "DSH Remote ${VERSION}" \
            --notes-file notes.md $prerelease
  npm:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Optional: publishing to npm also requires owning the @dsh-remote scope.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.NPM_TOKEN != ''
      - uses: oven-sh/setup-bun@v2
        if: env.NPM_TOKEN != ''
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: '24.19.0'
      - if: env.NPM_TOKEN != ''
        run: bun install --frozen-lockfile && bun run build:plugin
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: packages/dsh-plugin
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          npm publish --access public
